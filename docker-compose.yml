# Local stack — runs entirely offline (Demo LLM, local auth, no AWS credentials).
#   make dev        (or: docker compose up --build)
# Web: http://localhost:3000   API: http://localhost:8080   Postgres: localhost:5433
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    CASCADE_DATABASE_URL: postgresql+psycopg://cascade:cascade@postgres:5432/cascade
    CASCADE_LLM: demo
    CASCADE_AUTH: local
    CASCADE_DEMO: "true"
    CASCADE_ARTIFACT_RUNTIME: subprocess
    CASCADE_CRM_URL: http://crm-mock:8090
    CASCADE_DATA_DIR: /data
    CASCADE_AGENT_EXECUTOR: worker
    AWS_ACCESS_KEY_ID: testing
    AWS_SECRET_ACCESS_KEY: testing
    AWS_DEFAULT_REGION: us-east-1
  volumes:
    - cascade-data:/data
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a   # pgvector 0.8.7 (iterative HNSW scans need >= 0.8)
    # Local dev only: skip waiting for disk syncs on commit (Docker Desktop's VM makes them slow and
    # CPU-heavy). Aurora in production keeps full durability.
    command: ["postgres", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: cascade
      POSTGRES_DB: cascade
    ports:
      - "5433:5432"
    # pg_isready gets its own connect timeout and Docker a longer one: on a loaded machine Docker would otherwise
    # kill pg_isready mid-handshake, the starting backend dies of SIGPIPE, and Postgres restarts every connection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascade -t 20"]
      interval: 10s
      timeout: 30s
      start_period: 20s
      retries: 30
    volumes:
      - pg-data:/var/lib/postgresql/data

  api:
    <<: *backend
    ports:
      - "8080:8080"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

  agent-worker:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WITH_DL: "1"           # torch + transformers for the local dl trainer
    command: ["python", "-m", "app.agent.worker"]

  ingest-worker:
    <<: *backend
    command: ["python", "-m", "app.rag.worker"]

  crm-mock:
    <<: *backend
    depends_on: []
    ports:
      - "8090:8090"
    command: ["uvicorn", "app.crm_mock:app", "--host", "0.0.0.0", "--port", "8090"]

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  cascade-data:
  pg-data:
